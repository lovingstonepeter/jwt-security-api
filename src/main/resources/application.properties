spring.application.name=jwt-security

# --- Database (PostgreSQL) ---
# DB_PASSWORD is required. DB_URL and DB_USERNAME fall back to local defaults.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jwt_security_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Secrets: REQUIRED environment variables, deliberately no defaults ---
application.security.jwt.secret-key=${JWT_SECRET}
application.security.jwt.expiration-ms=86400000
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD}